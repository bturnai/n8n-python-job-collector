[project]
name = "n8n-python-job-collector"
version = "1.0.0"
description = "Python Code nodes for an n8n job-collection workflow"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest>=8"]
db = ["psycopg[binary]>=3.2"]
dbt = ["dbt-core~=1.12.0", "dbt-postgres>=1.9"]
eval = ["openpyxl>=3.1", "anthropic>=2.4"]
rag = ["sentence-transformers>=6.2", "pgvector>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
